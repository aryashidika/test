{% extends "base.html" %}
{% block title %}Model{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Model</h1>
  {% if not read_only %}
  <button class="btn" hx-get="{{ url_for('model.new_form') }}" hx-target="#modal" hx-swap="innerHTML">+ Tambah Model</button>
  {% endif %}
</div>

<div class="card">
  <form method="get" action="{{ url_for('model.list_page') }}" class="toolbar">
    <input type="search" name="q" value="{{ search }}" placeholder="Cari kode / nama model...">
    <select name="season" onchange="this.form.submit()">
      <option value="">Semua Season</option>
      {% for s in seasons %}
      <option value="{{ s }}" {{ "selected" if s==season else "" }}>{{ s }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-secondary">Cari</button>
  </form>

  {% include "model/_list_table.html" %}
</div>
{% endblock %}
