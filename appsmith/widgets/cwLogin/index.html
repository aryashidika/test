<div class="page">
  <div class="card">
    <div class="brand">
      <div class="logo">SC</div>
      <div>
        <div class="app-name" id="appName">Specsheet &amp; CBD System</div>
        <div class="app-sub">Master Data · Specsheet · CBD</div>
      </div>
    </div>

    <div id="msg" class="msg" role="alert" hidden></div>

    <!-- Tampilan: Masuk -->
    <div id="viewLogin" hidden>
      <h1>Log in</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="name@company.com">
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" data-for="password">Show</button>
      </div>
      <label class="check" for="remember">
        <input id="remember" type="checkbox">
        <span>Remember me</span>
      </label>
      <p class="hint hint-check">Stay logged in for 7 days (up to 30 days). Don't use on shared computers.</p>
      <button type="button" class="btn-primary btn-block" id="btnLogin">Log in</button>
      <p class="hint">Forgot password? Contact the System Admin.</p>
    </div>

    <!-- Tampilan: Ganti password -->
    <div id="viewChange" hidden>
      <h1>Change Password</h1>
      <p class="hint hint-top" id="changeHint">At least 8 characters.</p>
      <label for="oldPass">Old / temporary password</label>
      <div class="pw">
        <input id="oldPass" type="password" autocomplete="current-password">
        <button type="button" class="pw-toggle" data-for="oldPass">Show</button>
      </div>
      <label for="newPass">New password</label>
      <div class="pw">
        <input id="newPass" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-for="newPass">Show</button>
      </div>
      <label for="newPass2">Repeat new password</label>
      <div class="pw">
        <input id="newPass2" type="password" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-for="newPass2">Show</button>
      </div>
      <div class="actions">
        <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
        <button type="button" class="btn-primary" id="btnChange">Save</button>
      </div>
    </div>
  </div>
</div>
