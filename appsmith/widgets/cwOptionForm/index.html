<div class="wrap">
  <div class="head">
    <h2 id="title">Add Option</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label>Type</label>
  <div class="readonly" id="kindLabel"></div>
  <div class="hint" id="scopeNote"></div>

  <label for="value">Value <span class="req">*</span></label>
  <input id="value" type="text" maxlength="80" autocomplete="off">
  <div class="similar" id="similar" hidden>
    <div class="similar-title">A similar option exists. Use it if it is the same:</div>
    <ul id="similarList"></ul>
  </div>

  <div class="row">
    <div id="sortBox">
      <label for="sort">Order (position)</label>
      <input id="sort" type="number" min="1" step="1" autocomplete="off" placeholder="empty = last"
             title="Position in the list. If the number is already used, this option takes it and the others move down. Empty = last (new) or unchanged (edit).">
    </div>
    <div id="statusBox">
      <label for="status">Status <span class="req">*</span></label>
      <select id="status"></select>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
