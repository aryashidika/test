<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Pilihan</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label>Jenis</label>
  <div class="readonly" id="kindLabel"></div>
  <div class="hint" id="scopeNote"></div>

  <label for="value">Nilai <span class="req">*</span></label>
  <input id="value" type="text" maxlength="80" autocomplete="off">
  <div class="similar" id="similar" hidden>
    <div class="similar-title">Pilihan mirip sudah ada — pakai yang ini bila sama:</div>
    <ul id="similarList"></ul>
  </div>

  <div class="row">
    <div id="sortBox">
      <label for="sort">Urutan</label>
      <input id="sort" type="number" min="0" step="1" autocomplete="off" placeholder="opsional">
    </div>
    <div id="statusBox">
      <label for="status">Status <span class="req">*</span></label>
      <select id="status"></select>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
