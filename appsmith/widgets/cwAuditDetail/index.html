<div class="wrap">
  <div class="empty" id="empty">Select a row to see the details.</div>

  <div id="detail" hidden>
    <div class="head">
      <div class="line1">
        <span class="badge" id="action"></span>
        <span class="entity" id="entity"></span>
      </div>
      <div class="meta"><span id="time"></span> · <span id="user"></span></div>
      <div class="meta">ID <span class="mono" id="entityId"></span></div>
    </div>

    <div class="sec">
      <h3 id="title"></h3>
      <span class="count" id="count"></span>
    </div>
    <div class="note" id="note" hidden></div>
    <div class="rows" id="rows"></div>

    <button type="button" class="tech-toggle" id="btnTech" hidden></button>
    <div class="rows tech" id="techRows" hidden></div>
  </div>
</div>
