<header class="bar">
  <div class="left">
    <div class="logo">SC</div>
    <div class="titles">
      <div class="app" id="appName">Specsheet &amp; CBD System</div>
      <div class="page" id="pageTitle"></div>
    </div>
  </div>

  <div class="right">
    <button type="button" class="btn-ghost" id="btnHome" hidden>
      <span class="ico">⌂</span> Home
    </button>
    <div class="user" id="userBox" hidden>
      <div class="avatar" id="avatar"></div>
      <div class="who">
        <div class="name" id="userName"></div>
        <div class="role"><span class="chip" id="userRole"></span></div>
      </div>
    </div>
    <div class="sep"></div>
    <button type="button" class="btn-ghost" id="btnPassword">
      <span class="ico">🔑</span> Change Password
    </button>
    <button type="button" class="btn-light" id="btnLogout">
      <span class="ico">⎋</span> Log out
    </button>
  </div>
</header>
