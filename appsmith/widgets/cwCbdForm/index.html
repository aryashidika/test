<div class="wrap">
  <div class="head">
    <h2 id="title">Buat CBD</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div id="stageBox" hidden>
    <label>Stage CBD <span class="req">*</span></label>
    <div class="seg" id="stages" role="radiogroup" aria-label="Stage CBD"></div>
    <div class="hint" id="stageHint" hidden></div>
  </div>

  <div class="opts" id="opts" role="radiogroup" aria-label="Cara membuat CBD"></div>

  <div id="sourceBox" hidden>
    <label for="source">Article sumber <span class="req">*</span></label>
    <select id="source"></select>
    <div class="hint">Yang di-copy: CBD terbit terakhir article sumber.</div>
  </div>

  <div class="info" id="note" hidden></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Buat</button>
  </div>
</div>
