<div class="wrap">
  <div class="head">
    <h2 id="title">Create CBD</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div id="stageBox" hidden>
    <label>CBD stage <span class="req">*</span></label>
    <div class="seg" id="stages" role="radiogroup" aria-label="CBD stage"></div>
    <div class="hint" id="stageHint" hidden></div>
  </div>

  <div class="opts" id="opts" role="radiogroup" aria-label="How to create the CBD"></div>

  <div id="sourceBox" hidden>
    <label for="source">Source article <span class="req">*</span></label>
    <select id="source"></select>
    <div class="hint">Copied: the latest published CBD of the source article.</div>
  </div>

  <div class="info" id="note" hidden></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Create</button>
  </div>
</div>
