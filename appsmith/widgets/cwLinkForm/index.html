<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Supplier Material</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="materialLabel"></div>

  <label for="supplier">Supplier <span class="req">*</span></label>
  <select id="supplier"></select>
  <div class="readonly" id="supplierName" hidden></div>
  <div class="hint" id="supplierHint">Supplier harus sudah ada di Master Supplier.</div>

  <label class="check-row">
    <input id="preferred" type="checkbox">
    <span>Supplier utama (otomatis terisi di BOM saat material dipilih)</span>
  </label>

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="field-note" id="lockNote" hidden></div>
  <div class="info" id="proposeInfo" hidden>Supplier langsung terhubung ke material ini (semua varian). Harga per varian diajukan tim CBD.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
