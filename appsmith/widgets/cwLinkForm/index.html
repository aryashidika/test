<div class="wrap">
  <div class="head">
    <h2 id="title">Add Material Supplier</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="materialLabel"></div>

  <label for="supplier">Supplier <span class="req">*</span></label>
  <select id="supplier"></select>
  <div class="readonly" id="supplierName" hidden></div>
  <div class="hint" id="supplierHint">The supplier must exist in Master Supplier.</div>

  <label class="check-row">
    <input id="preferred" type="checkbox">
    <span>Main supplier (filled in the BOM when the material is selected)</span>
  </label>

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="field-note" id="lockNote" hidden></div>
  <div class="info" id="proposeInfo" hidden>The supplier is linked to this material (all variants). Prices per variant are proposed by the CBD team.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
