<div class="wrap">
  <div class="head">
    <h2 id="title">CBD Line Price</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="lineLabel"></div>
  <div class="current" id="current" hidden></div>
  <div class="sugg" id="sugg" hidden>
    <span id="suggText"></span>
    <button type="button" class="lnk" id="btnUse">Use</button>
  </div>

  <div class="row">
    <div>
      <label for="price">Price <span class="req" id="priceReq">*</span></label>
      <input id="price" type="text" inputmode="decimal" maxlength="20" autocomplete="off" placeholder="e.g. 45000 or 3,25">
      <div class="hint" id="priceHint">No thousand separators; use a comma or dot for decimals.</div>
    </div>
    <div>
      <label>Currency <span class="req">*</span></label>
      <div class="seg" id="currency">
        <button type="button" data-v="IDR">IDR</button>
        <button type="button" data-v="USD">USD</button>
      </div>
      <div class="hint">Required for every entry.</div>
    </div>
  </div>

  <div class="field" id="validBox" hidden>
    <label for="validFrom">Valid from <span class="req">*</span></label>
    <input id="validFrom" type="date">
    <div class="hint">The current master price ends on this date.</div>
  </div>

  <label for="text"><span id="textLabel">Reference</span> <span class="req" id="textReq">*</span></label>
  <textarea id="text" maxlength="300"></textarea>
  <div class="hint" id="textHint"></div>

  <div class="info" id="info" hidden></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
