<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Harga</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="materialLabel"></div>

  <label for="link">Supplier <span class="req">*</span></label>
  <select id="link"></select>

  <label for="color">Warna</label>
  <input id="color" type="text" maxlength="80" autocomplete="off" list="dlColor" placeholder="Kosongkan = semua warna">
  <datalist id="dlColor"></datalist>
  <div class="hint">Isi hanya untuk warna yang harganya berbeda dari harga semua warna.</div>

  <div class="row">
    <div>
      <label for="price">Harga <span class="req">*</span></label>
      <input id="price" type="text" inputmode="decimal" maxlength="20" autocomplete="off" placeholder="mis. 45000 atau 3,25">
      <div class="hint" id="priceHint">Tanpa titik ribuan; desimal pakai koma atau titik.</div>
    </div>
    <div>
      <label>Currency <span class="req">*</span></label>
      <div class="seg" id="currency">
        <button type="button" data-v="IDR">IDR</button>
        <button type="button" data-v="USD">USD</button>
      </div>
      <div class="hint">Wajib dipilih setiap input.</div>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="validFrom">Berlaku mulai <span class="req">*</span></label>
      <input id="validFrom" type="date">
    </div>
    <div>
      <label for="reference">Referensi</label>
      <input id="reference" type="text" maxlength="100" autocomplete="off" placeholder="no. quotation / PO (opsional)">
    </div>
  </div>

  <div class="info" id="closeInfo" hidden></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
