<div class="wrap">
  <div class="head">
    <h2 id="title">Add User</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label for="email">Email <span class="req">*</span></label>
  <input id="email" type="email" autocomplete="off" placeholder="name@company.com">
  <div class="field-note" id="emailNote" hidden>Email cannot be changed.</div>

  <label for="fullName">Full name <span class="req">*</span></label>
  <input id="fullName" type="text" maxlength="100" autocomplete="off">

  <label for="role">Role <span class="req">*</span></label>
  <select id="role"></select>

  <div id="factoryRow" hidden>
    <label for="factory">Factory <span class="req">*</span></label>
    <select id="factory"></select>
    <div class="field-note">Vendor Spec, Vendor CBD, and Manager Costing only see their factory data.</div>
  </div>

  <label class="switch-row">
    <input id="active" type="checkbox">
    <span class="switch"></span>
    <span>Active</span>
  </label>

  <div class="field-note" id="selfNote" hidden>You cannot change your own role and status.</div>
  <div class="info" id="addInfo" hidden>A temporary password is created and shown after saving.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
