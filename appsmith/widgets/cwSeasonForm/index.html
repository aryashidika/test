<div class="wrap">
  <div class="head">
    <h2>Season Baru</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label>Musim <span class="req">*</span></label>
  <div class="seg" id="half">
    <button type="button" data-v="SS">SS · Spring/Summer</button>
    <button type="button" data-v="FH">FH · Fall/Holiday</button>
  </div>

  <label for="year">Tahun (2 digit) <span class="req">*</span></label>
  <input id="year" type="text" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="mis. 26">

  <div class="info" id="preview"></div>
  <div class="hint" id="existing"></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
