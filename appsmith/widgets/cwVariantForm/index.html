<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Varian</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="materialLabel"></div>

  <label for="code">Material Code <span class="req">*</span></label>
  <input id="code" type="text" maxlength="40" autocomplete="off" placeholder="mis. 205Q404A52 (dari ERP)">
  <div class="hint">Kode ERP 10 karakter: 4 jenis material · 3 thickness · 3 warna. Terisi otomatis dari warna &amp; thickness bila bagian kodenya sudah pernah dipakai (atau sebaliknya) — tetap cocokkan dengan ERP.</div>
  <div class="sug" id="sugBox" hidden></div>
  <div class="conf-box" id="confBox" hidden>
    <div id="confText"></div>
    <label class="conf-check"><input type="checkbox" id="confChk"> Sudah saya cek, kode ini benar sesuai ERP</label>
  </div>
  <div class="warn-box" id="infoBox" hidden></div>

  <label for="color">Warna <span class="req">*</span></label>
  <input id="color" type="text" maxlength="80" autocomplete="off" placeholder="mis. WHITE">
  <div class="hint" id="colorNote" hidden></div>

  <label for="thickness">Thickness</label>
  <input id="thickness" type="text" maxlength="60" autocomplete="off" placeholder="persis ERP, mis. 44&quot; atau 1.2MMX54&quot; — kosong / . = tidak ada">
  <div class="hint" id="thicknessNote" hidden></div>

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-secondary" id="btnAgain">Simpan &amp; tambah lagi</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
