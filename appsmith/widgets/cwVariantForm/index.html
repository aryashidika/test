<div class="wrap">
  <div class="head">
    <h2 id="title">Add Variant</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="materialLabel"></div>

  <label for="code">Material Code <span class="req">*</span></label>
  <input id="code" type="text" maxlength="40" autocomplete="off" placeholder="e.g. 205Q404A52 (from ERP)">
  <div class="hint">10-character ERP code: 4 material type · 3 dimension · 3 color. Each part has one meaning in this factory. Filled in from color &amp; dimension when those code parts were used before (or the other way round). Still check against ERP.</div>
  <div class="sug" id="sugBox" hidden></div>
  <div class="conf-box" id="confBox" hidden>
    <div id="confText"></div>
    <div class="use-row" id="useRow" hidden><button type="button" class="btn-primary" id="btnUse">Use this variant</button></div>
  </div>
  <div class="warn-box" id="infoBox" hidden></div>

  <label for="color">Color <span class="req">*</span></label>
  <input id="color" type="text" maxlength="80" autocomplete="off" placeholder="e.g. WHITE">
  <div class="hint" id="colorNote" hidden></div>

  <label for="thickness">Dimension</label>
  <input id="thickness" type="text" maxlength="60" autocomplete="off" list="dlDims" placeholder="pick from the list or type, e.g. 44&quot; or 1.2 MM X 54&quot;. Empty / . = none">
  <datalist id="dlDims"></datalist>
  <div class="hint" id="thicknessNote" hidden></div>

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-secondary" id="btnAgain">Save &amp; add another</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
