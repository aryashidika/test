<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Komponen</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label for="group">Kelompok <span class="req">*</span></label>
  <select id="group"></select>

  <label for="number">Nomor <span class="req">*</span></label>
  <input id="number" type="number" min="0" step="10" autocomplete="off">
  <div class="hint" id="numberHint"></div>
  <button type="button" class="link" id="btnSuggest" hidden>Pakai saran</button>

  <label for="name">Nama komponen <span class="req">*</span></label>
  <input id="name" type="text" maxlength="150" autocomplete="off" placeholder="mis. Vamp">

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="info" id="proposeInfo" hidden>Usulan tersimpan sebagai PROPOSED dan menunggu persetujuan Master Admin.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
