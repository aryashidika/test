<div class="wrap">
  <div class="head">
    <h2 id="title">Buat Revisi</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="opts" id="opts" role="radiogroup" aria-label="Cara membuat revisi"></div>

  <div id="firstBox" hidden>
    <div id="sourceBox" hidden>
      <label for="source" id="sourceLabel">Season sumber <span class="req">*</span></label>
      <select id="source"></select>
      <div class="hint" id="sourceHint">Baris BOM revisi terbit terakhir season sumber di-copy. Article season ini dimuat dengan warna kosong.</div>
      <div class="info" id="sourceSum" hidden></div>
    </div>
    <label for="stage">Stage awal <span class="req">*</span></label>
    <select id="stage"></select>
  </div>

  <div id="nextBox" hidden>
    <label for="nextStage">Target stage <span class="req">*</span></label>
    <select id="nextStage"></select>
    <div class="hint">Stages can be skipped. Default: the next stage.</div>
  </div>

  <div class="info" id="note" hidden></div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Buat</button>
  </div>
</div>
