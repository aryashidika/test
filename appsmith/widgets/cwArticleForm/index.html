<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Article</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="seasonInfo"></div>

  <label for="code">Kode Article <span class="req">*</span></label>
  <input id="code" type="text" maxlength="40" autocomplete="off" placeholder="mis. GY1234">
  <div class="field-note" id="codeNote" hidden>Kode tidak bisa diubah karena article sudah dipakai di specsheet/CBD.</div>

  <label for="colorway">Colorway <span class="req">*</span></label>
  <input id="colorway" type="text" maxlength="120" autocomplete="off" placeholder="mis. Core Black / Cloud White">

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
