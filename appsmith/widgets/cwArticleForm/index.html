<div class="wrap">
  <div class="head">
    <h2 id="title">Add Article</h2>
    <button type="button" class="x" id="btnX" aria-label="Close">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <div class="hint" id="seasonInfo"></div>

  <label for="code">Article No.</label>
  <input id="code" type="text" maxlength="40" autocomplete="off" placeholder="e.g. GY1234 (empty if not known yet)">
  <div class="field-note" id="codeHint">Can stay empty in the early stages. Required to publish the Production specsheet (a warning from SMS). A typo can be corrected until the article is in a published Production specsheet/CBD.</div>
  <div class="field-note" id="codeNote" hidden>The article no. cannot be changed because the article is in a published Production specsheet/CBD.</div>

  <label for="colorway">Colorway <span class="req">*</span></label>
  <input id="colorway" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Core Black / Cloud White">

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Cancel</button>
    <button type="button" class="btn-primary" id="btnSave">Save</button>
  </div>
</div>
