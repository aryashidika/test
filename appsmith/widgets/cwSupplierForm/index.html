<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Supplier</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label for="name">Nama supplier <span class="req">*</span></label>
  <input id="name" type="text" maxlength="150" autocomplete="off" placeholder="mis. PT Maju Jaya">
  <div class="hint">Nama yang hanya beda huruf besar/kecil atau spasi dianggap sama.</div>

  <div id="statusBox">
    <label for="status">Status <span class="req">*</span></label>
    <select id="status"></select>
  </div>

  <div class="info" id="addInfo" hidden>Supplier baru langsung berstatus APPROVED.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
