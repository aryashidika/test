<div class="wrap">
  <div class="head">
    <h3 id="title">Images</h3>
    <span class="count" id="count"></span>
  </div>
  <div class="empty" id="empty"></div>
  <div class="grid" id="grid" hidden></div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <span id="vname"></span>
    <span class="vgap"></span>
    <button type="button" class="vbtn" id="vprev" title="Previous">‹</button>
    <button type="button" class="vbtn" id="vnext" title="Next">›</button>
    <button type="button" class="vbtn" id="vdl" title="Download">Download</button>
    <button type="button" class="vbtn" id="vclose" title="Close">✕</button>
  </div>
  <div class="vbody"><img id="vimg" alt=""></div>
</div>
