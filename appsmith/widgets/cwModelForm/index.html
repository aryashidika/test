<div class="wrap">
  <div class="head">
    <h2 id="title">Tambah Model</h2>
    <button type="button" class="x" id="btnX" aria-label="Tutup">✕</button>
  </div>

  <div id="msg" class="msg" role="alert" hidden></div>

  <label for="name">Nama Model <span class="req">*</span></label>
  <input id="name" type="text" maxlength="200" autocomplete="off">

  <div class="row">
    <div>
      <label for="category_id">Kategori <span class="req">*</span></label>
      <select id="category_id"></select>
    </div>
    <div>
      <label for="gender_id">Gender</label>
      <select id="gender_id"></select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="construction_id">Construction</label>
      <select id="construction_id"></select>
    </div>
    <div>
      <label for="last_id">Last No.</label>
      <select id="last_id"></select>
    </div>
  </div>

  <label for="outsole_mold_id">Outsole Mould</label>
  <select id="outsole_mold_id"></select>

  <div class="size-head">
    <label>Ukuran</label>
    <span class="size-sum" id="sizeSum">Belum dipilih</span>
    <button type="button" class="link" id="btnSizeClear">Kosongkan</button>
  </div>
  <div class="sizes" id="sizes" role="group" aria-label="Pilih ukuran"></div>
  <div class="hint">Klik ukuran awal lalu ukuran akhir untuk memilih rentang. Klik ukuran terpilih untuk membuangnya.</div>

  <label for="sample_size">Sample Size</label>
  <select id="sample_size"></select>

  <div class="hint">Nama model unik di pabrik Anda. Pilihan dropdown baru ditambah di Master Pilihan.</div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnCancel">Batal</button>
    <button type="button" class="btn-primary" id="btnSave">Simpan</button>
  </div>
</div>
